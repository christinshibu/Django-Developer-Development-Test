{% extends 'base.html' %}

{% block title %}Delete Product{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body text-center p-4">
                <h4>Delete Product?</h4>
                <p class="mt-3">Are you sure you want to delete <strong>{{ product.name }}</strong> (SKU: {{ product.sku }})?</p>
                <p class="text-muted">This cannot be undone.</p>

                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'product_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
